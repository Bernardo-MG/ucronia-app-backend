###############################################################################
#                             APPLICATION CONFIG                              #
###############################################################################

# Development options
# debug: true

spring:
  mvc:
    locale: es
    locale-resolver: fixed
  messages:
    encoding: UTF-8
    basename: messages,security-messages/messages
  data:
    web:
      pageable:
        default-page-size: 10
  aop:
    proxy-target-class: false
  cache:
    cache-names: cache1
    caffeine:
      spec: maximumSize=500,expireAfterAccess=10m
  liquibase:
    liquibase-schema: db_versioning
  jackson:
    time-zone: UTC

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs

security:
  permissions:
    files:
      - classpath:association_permissions.yml

# CORS
cors:
  pattern: /**
  allowedOrigins: ${CORS_ALLOWED_ORIGINS}
  allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowedHeaders: Authorization,Content-Type,Accept,Origin,X-Request-ID
  exposedHeaders: Location,X-Request-ID
  allowCredentials: true
  maxAge: 3600