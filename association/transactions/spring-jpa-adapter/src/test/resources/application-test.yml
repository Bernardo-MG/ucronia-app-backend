###############################################################################
#                             APPLICATION CONFIG                              #
###############################################################################

spring:
  aop:
    proxy-target-class: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-test.yaml

  jpa:
    show-sql: true               # Shows SQL statements
    properties:
      hibernate.format_sql: true # Formats SQL for readability
      hibernate.use_sql_comments: true

logging:
  level:
    org.hibernate.SQL: DEBUG               # Log SQL queries
    org.hibernate.type.descriptor.sql: TRACE  # Log query parameters
    org.hibernate.orm.jdbc.bind: TRACE        # (Hibernate 6) Log binding params