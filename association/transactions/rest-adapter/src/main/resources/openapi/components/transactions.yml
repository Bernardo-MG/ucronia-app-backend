components:
  parameters:
    transactionsSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(description|date|index|amount)\|(asc|desc)$'
          example: date|asc
  schemas:
    TransactionCreation:
      type: object
      required: [date, amount, description]
      properties:
        date:
          $ref: '../common/dates.yml#/components/schemas/Date'
        amount:
          type: number
          format: float
        description:
          type: string
          maxLength: 200
        transactionType:
          type: integer
          format: int64
          minimum: 1
          description: Type to assign. Omit to create an untyped transaction.
    TransactionUpdate:
      type: object
      required: [date, amount, description]
      properties:
        date:
          $ref: '../common/dates.yml#/components/schemas/Date'
        amount:
          type: number
          format: float
        description:
          type: string
          maxLength: 200
        transactionType:
          type: integer
          format: int64
          minimum: 0
          description: Type to assign. Omit to keep the existing type, or send 0 to clear it.
    Transaction:
      type: object
      required: [index, date, amount, description]
      properties:
        index:
          $ref: '../common/ids.yml#/components/schemas/Id'
        date:
          $ref: '../common/dates.yml#/components/schemas/Date'
        amount:
          type: number
          format: float
        description:
          type: string
          maxLength: 200
        transactionType:
          type: integer
          format: int64
          minimum: 1
          description: Number of the assigned transaction type, when present.
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'
    TransactionMonth:
      type: object
      required: [year, month]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
    TransactionMonthsRange:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items:
            $ref: '#/components/schemas/TransactionMonth'
    TransactionMonthsRangeResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/TransactionMonthsRange'
    TransactionPageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
    TransactionResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Transaction'
    TransactionsResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'