get:
  summary: Get monthly evolution.
  operationId: getMonthlyTransactionEvolution
  tags: [TransactionEvolution]
  parameters:
    - name: from
      description: Starting date to query for.
      in: query
      schema:
        $ref: '../common/dates.yml#/components/schemas/Date'
    - name: to
      description: Ending date to query for.
      in: query
      schema:
        $ref: '../common/dates.yml#/components/schemas/Date'
  responses:
    '200':
      description: Transactions page
      content:
        application/json:
          schema:
            $ref: '../components/transactions_evolution.yml#/components/schemas/TransactionMonthlyEvolutionResponse'