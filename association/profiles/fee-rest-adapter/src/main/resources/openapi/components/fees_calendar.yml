components:
  schemas:
    YearsRange:
      type: object
      required: [years]
      properties:
        years:
          type: array
          items:
            type: integer
            minimum: 1990
            maximum: 3000
            example: 2023
    YearsRangeResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/YearsRange'