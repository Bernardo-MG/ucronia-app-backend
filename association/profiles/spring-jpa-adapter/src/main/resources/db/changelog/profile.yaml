databaseChangeLog:
  - changeSet:
      id: profile_schema
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_directory_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: profile
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: profiles
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: identifier
                  type: varchar(15)
                  defaultValue: ''
              - column:
                  name: number
                  type: bigint
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(50)
                  defaultValue: ''
              - column:
                  name: nickname
                  type: varchar(50)
              - column:
                  name: birth_date
                  type: datetime
              - column:
                  name: comments
                  type: varchar(250)
                  defaultValue: ''
              - column:
                  name: address
                  type: varchar(250)
                  defaultValue: ''
              - column:
                  name: types
                  type: json
                  defaultValue: '[]'
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_fees_created_by_user
                    references: security.users(id)
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_fees_updated_by_user
                    references: security.users(id)
        - addAutoIncrement:
            schemaName: directory
            tableName: profiles
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createIndex:
            schemaName: directory
            tableName: profiles
            indexName: idx_profiles_number
            columns:
              - column:
                  name: number
        - createTable:
            schemaName: directory
            tableName: contact_methods
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: false
        - addAutoIncrement:
            schemaName: directory
            tableName: contact_methods
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createIndex:
            schemaName: directory
            tableName: contact_methods
            indexName: idx_contact_methods_number
            columns:
              - column:
                  name: number
        - createTable:
            schemaName: directory
            tableName: contact_channels
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: profile_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contact_channels_profile
                    references: directory.profiles(id)
                    deleteCascade: true
              - column:
                  name: contact_method_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contact_channels_contact_method
                    references: directory.contact_methods(id)
                    deleteCascade: true
              - column:
                  name: detail
                  type: varchar(50)
                  constraints:
                    nullable: false
        - addAutoIncrement:
            schemaName: directory
            tableName: contact_channels
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
  - changeSet:
      id: spanish_names
      author: Bernardo
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE COLLATION IF NOT EXISTS directory.spanish_names
                (provider = icu, locale = 'es-ES-u-ks-level2');

              ALTER TABLE directory.profiles
                ALTER COLUMN first_name TYPE varchar(50)
                COLLATE directory.spanish_names;

              ALTER TABLE directory.profiles
                ALTER COLUMN last_name TYPE varchar(50)
                COLLATE directory.spanish_names;

              ALTER TABLE directory.profiles
                ALTER COLUMN nickname TYPE varchar(50)
                COLLATE directory.spanish_names;