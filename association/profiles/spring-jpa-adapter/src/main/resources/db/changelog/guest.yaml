databaseChangeLog:
  - changeSet:
      id: guest
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: guests
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_guests_profile
                    references: directory.profiles(id)
                    deleteCascade: true
        - createTable:
            schemaName: directory
            tableName: guest_games
            columns:
              - column:
                  name: guest_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_guest_games_guest
                    references: directory.guests(id)
                    deleteCascade: true
              - column:
                  name: date
                  type: datetime
                  constraints:
                    nullable: false
        - addPrimaryKey:
              constraintName: pk_guest_games
              schemaName: directory
              tableName: guest_games
              columnNames: 'guest_id, date'
