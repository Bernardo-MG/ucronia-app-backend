databaseChangeLog:
  - changeSet:
      id: inventory_schema
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_inventory_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: key
      author: Bernardo
      changes:
        - createTable:
            schemaName: inventory
            tableName: keys
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: available
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(250)
                  defaultValue: ''
                  constraints:
                    nullable: false
        - addAutoIncrement:
            schemaName: inventory
            tableName: keys
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createIndex:
            schemaName: inventory
            tableName: keys
            indexName: idx_keys_number
            columns:
              - column:
                  name: number

