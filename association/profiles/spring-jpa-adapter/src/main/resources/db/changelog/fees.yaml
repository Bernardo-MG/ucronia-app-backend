databaseChangeLog:
  - changeSet:
      id: fees
      author: Bernardo
      changes:
        - createTable:
            schemaName: funds
            tableName: fee_types
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fee_types
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_fee_types_number
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_fee_types_name
                    nullable: false
              - column:
                  name: amount
                  type: decimal(10,2)
                  constraints:
                    nullable: false
                  defaultValueNumeric: 0
        - addAutoIncrement:
            schemaName: funds
            tableName: fee_types
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createTable:
            schemaName: funds
            tableName: fees
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fees
                    nullable: false
              - column:
                  name: member_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: month
                  type: datetime
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: paid
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValue: false
              - column:
                  name: fee_type_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: bigint
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: fk_fees_member
            baseTableSchemaName: funds
            baseTableName: fees
            baseColumnNames: member_id
            referencedTableSchemaName: directory
            referencedTableName: profiles
            referencedColumnNames: id
            onDelete: "RESTRICT"
        - addForeignKeyConstraint:
            constraintName: fk_fees_fee_type
            baseTableSchemaName: funds
            baseTableName: fees
            baseColumnNames: fee_type_id
            referencedTableSchemaName: funds
            referencedTableName: fee_types
            referencedColumnNames: id
            onDelete: "RESTRICT"
        - addForeignKeyConstraint:
            constraintName: fk_fees_created_by_user
            baseTableSchemaName: funds
            baseTableName: fees
            baseColumnNames: created_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addForeignKeyConstraint:
            constraintName: fk_fees_updated_by_user
            baseTableSchemaName: funds
            baseTableName: fees
            baseColumnNames: updated_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addAutoIncrement:
            schemaName: funds
            tableName: fees
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - addForeignKeyConstraint:
            constraintName: fk_fees_transaction
            baseTableSchemaName: funds
            baseTableName: fees
            baseColumnNames: transaction_id
            referencedTableSchemaName: funds
            referencedTableName: transactions
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addUniqueConstraint:
            constraintName: uk_fees_member_month
            schemaName: funds
            tableName: fees
            columnNames: 'member_id, month'
      modifySql:
        - append:
            dbms: mysql
            value: ' ENGINE=InnoDB DEFAULT CHARSET=latin1'
