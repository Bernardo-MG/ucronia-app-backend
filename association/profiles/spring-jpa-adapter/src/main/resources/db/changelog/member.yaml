databaseChangeLog:
  - changeSet:
      id: inventory_schema
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_inventory_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: member
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: members
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_member_profile
                    references: directory.profiles(id)
                    deleteCascade: true
              - column:
                  name: fee_type_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fees_fee_type
                    references: funds.fee_types(id)
                    deleteCascade: true
              - column:
                  name: active
                  type: boolean
                  defaultValue: true
              - column:
                  name: renew_membership
                  type: boolean
                  defaultValue: true
              - column:
                  name: key_id
                  type: bigint
                  constraints:
                    unique: true
                    foreignKeyName: fk_members_key
                    references: inventory.keys(id)
                    deleteCascade: true

