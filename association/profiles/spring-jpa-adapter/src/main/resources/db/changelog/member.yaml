databaseChangeLog:
  - changeSet:
      id: member
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: members
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_member_profile
                    references: directory.profiles(id)
                    deleteCascade: true
              - column:
                  name: fee_type_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fees_fee_type
                    references: funds.fee_types(id)
                    deleteCascade: true
              - column:
                  name: active
                  type: boolean
                  defaultValue: true
              - column:
                  name: renew_membership
                  type: boolean
                  defaultValue: true
              - column:
                  name: key_number
                  type: bigint
        - addUniqueConstraint:
            constraintName: member_key_number_unique
            schemaName: directory
            tableName: members
            columnNames: key_number
        - createIndex:
            schemaName: directory
            tableName: members
            indexName: idx_member_key_number
            columns:
              - column:
                  name: key_number
