databaseChangeLog:
  - changeSet:
      id: inventory_schema
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_inventory_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: key
      author: Bernardo
      changes:
        - createTable:
            schemaName: inventory
            tableName: keys
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: missing
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(250)
                  defaultValue: ''
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: inventory
            tableName: keys
            indexName: idx_keys_number
            columns:
              - column:
                  name: number
  - changeSet:
      id: member
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: members
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_member_profile
                    references: directory.profiles(id)
                    deleteCascade: true
              - column:
                  name: fee_type_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fees_fee_type
                    references: funds.fee_types(id)
                    deleteCascade: true
              - column:
                  name: active
                  type: boolean
                  defaultValue: true
              - column:
                  name: renew_membership
                  type: boolean
                  defaultValue: true
              - column:
                  name: key_number
                  type: bigint
                  constraints:
                    unique: true
                    nullable: false
                    foreignKeyName: fk_members_key_number
                    references: inventory.keys(id)
                    deleteCascade: true
        - createIndex:
            schemaName: directory
            tableName: members
            indexName: idx_member_key_number
            columns:
              - column:
                  name: key_number
