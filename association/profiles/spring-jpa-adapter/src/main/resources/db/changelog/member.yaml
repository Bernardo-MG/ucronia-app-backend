databaseChangeLog:
  - changeSet:
      id: member
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: members
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_members_profile
                    references: directory.profiles(id)
                    deleteCascade: true
              - column:
                  name: member_number
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: fee_type_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValue: true
              - column:
                  name: renew_membership
                  type: boolean
                  defaultValue: true
        - addForeignKeyConstraint:
            constraintName: fk_members_fee_type
            baseTableSchemaName: directory
            baseTableName: members
            baseColumnNames: fee_type_id
            referencedTableSchemaName: funds
            referencedTableName: fee_types
            referencedColumnNames: id
            onDelete: "SET NULL"
  - changeSet:
      id: key-assignment-table
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: key_assignments
            columns:
              - column:
                  name: key_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_key_assignments_key
                    references: inventory.keys(id)
                    deleteCascade: true
              - column:
                  name: profile_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_key_assignments_profile
                    foreignKeyName: fk_key_assignments_profile
                    references: directory.profiles(id)
                    deleteCascade: true
  - changeSet:
      id: key-assignment-multiple-keys-per-profile
      author: Bernardo
      changes:
        - dropUniqueConstraint:
            schemaName: directory
            tableName: key_assignments
            constraintName: uk_key_assignments_profile
        - createIndex:
            schemaName: directory
            tableName: key_assignments
            indexName: idx_key_assignments_profile
            columns:
              - column:
                  name: profile_id
