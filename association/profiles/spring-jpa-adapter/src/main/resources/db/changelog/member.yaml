databaseChangeLog:
  - changeSet:
      id: member
      author: Bernardo
      changes:
        - createTable:
            schemaName: directory
            tableName: members
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_member_profile
                    references: directory.profiles(id)
                    deleteCascade: true
              - column:
                  name: fee_type_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValue: true
              - column:
                  name: renew_membership
                  type: boolean
                  defaultValue: true
              - column:
                  name: key_id
                  type: bigint
                  constraints:
                    unique: true
        - addForeignKeyConstraint:
            constraintName: fk_fees_fee_type
            baseTableSchemaName: directory
            baseTableName: members
            baseColumnNames: fee_type_id
            referencedTableSchemaName: funds
            referencedTableName: fee_types
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addForeignKeyConstraint:
            constraintName: fk_members_key
            baseTableSchemaName: directory
            baseTableName: members
            baseColumnNames: key_id
            referencedTableSchemaName: inventory
            referencedTableName: keys
            referencedColumnNames: id
            onDelete: "SET NULL"
