components:
  parameters:
    sponsorsSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(name.firstName|name.lastName|number)\|(asc|desc)$'
          example: username|asc
  schemas:
    ContactMethod:
      type: object
      required: [number, name]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          type: string
          maxLength: 50
          description: Name of the contact method.
    ContactChannel:
      type: object
      required: [method, detail]
      properties:
        method:
          $ref: '#/components/schemas/ContactMethod'
        detail:
          type: string
          maxLength: 50
          description: Contact channel detail.
    EditionContactChannel:
      type: object
      required: [method, detail]
      properties:
        method:
          $ref: '../common/ids.yml#/components/schemas/Id'
        detail:
          type: string
          maxLength: 50
          description: Contact detail.
    Sponsor:
      type: object
      required: [number, name]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        identifier:
          type: string
          maxLength: 15
          description: Unique identifier of the sponsor.
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/Name'
        birthDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
        contactChannels:
          type: array
          items:
            $ref: '#/components/schemas/ContactChannel'
        years:
          type: array
          items:
            type: integer
        address:
          type: string
          maxLength: 250
          description: Sponsor address.
        comments:
          type: string
          maxLength: 250
          description: Comments about the sponsor.
        types:
          type: array
          items:
            type: string
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'
    SponsorCreation:
      type: object
      required: [name]
      properties:
        identifier:
          type: string
          maxLength: 15
          description: Unique identifier of the sponsor.
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/EditionName'
    SponsorUpdate:
      type: object
      required: [name]
      properties:
        identifier:
          type: string
          maxLength: 15
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/EditionName'
        birthDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
        contactChannels:
          type: array
          items:
            $ref: '#/components/schemas/EditionContactChannel'
        years:
          type: array
          items:
            type: integer
        address:
          type: string
          maxLength: 250
          description: Sponsor address.
        comments:
          type: string
          maxLength: 250
    SponsorPatch:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 15
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/EditionName'
        birthDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
        contactChannels:
          type: array
          items:
            $ref: '#/components/schemas/EditionContactChannel'
        years:
          type: array
          items:
            type: integer
        address:
          type: string
          maxLength: 250
          description: Sponsor address.
        comments:
          type: string
          maxLength: 250
    SponsorPageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Sponsor'
    SponsorResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Sponsor'