components:
  parameters:
    membersSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(name\.firstName|name\.lastName|number)\|(asc|desc)$'
          example: username|asc
  schemas:
    ContactMethod:
      type: object
      required: [number, name]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          type: string
          maxLength: 50
          description: Name of the contact method.
    ContactChannel:
      type: object
      required: [method, detail]
      properties:
        method:
          $ref: '#/components/schemas/ContactMethod'
        detail:
          type: string
          maxLength: 50
          description: Contact channel detail.
    EditionContactChannel:
      type: object
      required: [method, detail]
      properties:
        method:
          $ref: '../common/ids.yml#/components/schemas/Id'
        detail:
          type: string
          maxLength: 50
          description: Contact detail.
    PublicMember:
      type: object
      required: [number, name]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/Name'
        renew:
          type: boolean
          description: Whether the member is eligible for renewal.
    Member:
      type: object
      required: [number, name]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        identifier:
          type: string
          maxLength: 15
          description: Unique identifier of the member.
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/Name'
        birthDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
        contactChannels:
          type: array
          items:
            $ref: '#/components/schemas/ContactChannel'
        address:
          type: string
          maxLength: 250
          description: Member address.
        comments:
          type: string
          maxLength: 250
          description: Comments about the member.
        keyNumber:
          $ref: '../common/ids.yml#/components/schemas/Id'
        feeType:
          $ref: '#/components/schemas/MemberFeeType'
        active:
          type: boolean
          description: Whether the member is active.
        renew:
          type: boolean
          description: Whether the member is eligible for renewal.
        types:
          type: array
          items:
            type: string
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'
    MemberCreation:
      type: object
      required: [feeType, identifier, name]
      properties:
        feeType:
          $ref: '../common/ids.yml#/components/schemas/Id'
        identifier:
          type: string
          description: Unique identifier of the member.
          maxLength: 15
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/EditionName'
    MemberUpdate:
      type: object
      required: [name, active, renew]
      properties:
        identifier:
          type: string
          maxLength: 15
        feeType:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          $ref: '../../profile/components/profiles.yml#/components/schemas/EditionName'
        birthDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
        contactChannels:
          type: array
          items:
            $ref: '#/components/schemas/EditionContactChannel'
        address:
          type: string
          description: Member address.
          maxLength: 250
        comments:
          type: string
          maxLength: 250
        keyNumber:
          $ref: '../common/ids.yml#/components/schemas/Id'
        active:
          type: boolean
          description: Whether the member is active.
        renew:
          type: boolean
          description: Whether the member is eligible for renewal.
    MemberStatus:
      type: string
      description: Status filter for member queries.
      enum: [ACTIVE, INACTIVE, ALL]
    MemberFeeType:
      type: object
      required: [number, name, amount]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          type: string
          maxLength: 50
        amount:
          type: number
          format: float
          minimum: 0
    ProfileMembershipConversion:
      type: object
      properties:
        feeType:
          $ref: '../common/ids.yml#/components/schemas/Id'
    PublicMemberPageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/PublicMember'
    MemberPageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    PublicMemberResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/PublicMember'
    MemberResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Member'