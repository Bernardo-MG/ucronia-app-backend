get:
  summary: Get all keys with their member assignments, including inactive members.
  operationId: getKeyAssignments
  tags: [KeyAssignment]
  parameters:
    - $ref: '../common/pagination.yml#/components/parameters/pageParam'
    - $ref: '../common/pagination.yml#/components/parameters/sizeParam'
    - $ref: '../components/keys.yml#/components/parameters/keysSortParam'
  responses:
    '200':
      description: Key assignment page. An absent member means the key is unassigned.
      content:
        application/json:
          schema:
            $ref: '../components/keys.yml#/components/schemas/KeyAssignmentPageResponse'
post:
  summary: Assign an unassigned key to a member.
  description: Uses the member profile number. A key or member already assigned to another counterpart causes a conflict.
  operationId: createKeyAssignment
  tags: [KeyAssignment]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/keys.yml#/components/schemas/KeyAssignmentCreation'
  responses:
    '201':
      description: Created key assignment.
      content:
        application/json:
          schema:
            $ref: '../components/keys.yml#/components/schemas/KeyAssignmentResponse'
    '400':
      description: Invalid assignment request.
    '404':
      description: Key or member profile not found.
    '409':
      description: Key or member already assigned.
