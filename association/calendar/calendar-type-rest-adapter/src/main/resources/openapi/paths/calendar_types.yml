post:
  summary: Create a calendar type.
  operationId: createCalendarType
  tags: [CalendarType]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/calendar_types.yml#/components/schemas/CalendarTypeCreation'
  responses:
    '201':
      description: Calendar type created.
      content:
        application/json:
          schema:
            $ref: '../components/calendar_types.yml#/components/schemas/CalendarTypeResponse'

get:
  summary: Get all calendar types.
  operationId: getAllCalendarTypes
  tags: [CalendarType]
  parameters:
    - $ref: '../common/pagination.yml#/components/parameters/pageParam'
    - $ref: '../common/pagination.yml#/components/parameters/sizeParam'
    - $ref: '../components/calendar_types.yml#/components/parameters/calendarTypesSortParam'
  responses:
    '200':
      description: Calendar types page
      content:
        application/json:
          schema:
            $ref: '../components/calendar_types.yml#/components/schemas/CalendarTypePageResponse'
