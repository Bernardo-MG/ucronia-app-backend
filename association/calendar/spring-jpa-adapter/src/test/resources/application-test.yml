###############################################################################
#                             APPLICATION CONFIG                              #
###############################################################################

spring:
  aop:
    proxy-target-class: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-test.yaml
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE