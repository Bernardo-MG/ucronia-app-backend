databaseChangeLog:
  - changeSet:
      id: scheduled_game
      author: Bernardo
      changes:
        - createTable:
            schemaName: calendar
            tableName: game_tables
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(100)
                  constraints:
                    nullable: false
        - addAutoIncrement:
            schemaName: calendar
            tableName: game_tables
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createIndex:
            schemaName: calendar
            tableName: game_tables
            indexName: idx_game_table_number
            columns:
              - column:
                  name: number
        - createTable:
            schemaName: calendar
            tableName: scheduled_games
            columns:
              - column:
                  name: calendar_info
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_scheduled_games_calendar_info
                    references: calendar.calendar_info(id)
                    deleteCascade: true
              - column:
                  name: game_table_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: master_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: max_players
                  type: bigint
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_scheduled_games_game_table
            baseTableSchemaName: calendar
            baseTableName: scheduled_games
            baseColumnNames: game_table_id
            referencedTableSchemaName: calendar
            referencedTableName: game_tables
            referencedColumnNames: id
            onDelete: SET NULL:
        - addForeignKeyConstraint:
            constraintName: fk_scheduled_games_master
            baseTableSchemaName: calendar
            baseTableName: scheduled_games
            baseColumnNames: master_id
            referencedTableSchemaName: directory
            referencedTableName: profiles
            referencedColumnNames: id
            onDelete: SET NULL:
  - changeSet:
      id: scheduled_game_initial_data
      author: Bernardo
      changes:
        - insert:
            schemaName: calendar
            tableName: calendar_type
            columns:
              - column:
                  name: number
                  valueNumeric: 2
              - column:
                  name: name
                  value: Oneshot
              - column:
                  name: color
                  value: '#008000'
        - insert:
            schemaName: calendar
            tableName: calendar_type
            columns:
              - column:
                  name: number
                  valueNumeric: 3
              - column:
                  name: name
                  value: Campaña
              - column:
                  name: color
                  value: '#0000FF'
      modifySql:
        - append:
            dbms: mysql
            value: ' ENGINE=InnoDB DEFAULT CHARSET=latin1'