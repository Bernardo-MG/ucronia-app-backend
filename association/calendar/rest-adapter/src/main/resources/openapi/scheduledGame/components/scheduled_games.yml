components:
  parameters:
    scheduledGamesSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      required: false
      schema:
        type: array
        items:
          type: string
          pattern: '^(description|title|location|start|maxPlayers|status)\|(asc|desc)$'
          example: date|asc

  schemas:
    ScheduledGameDate:
      type: object
      required: [start, end]
      properties:
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        end:
          $ref: '../common/dates.yml#/components/schemas/Date'

    GameTable:
      type: object
      required: [start, end]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        title:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 200

    ScheduledGameCreation:
      type: object
      required: [title, master, maxPlayers, start, gameType]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        table:
          $ref: '../common/ids.yml#/components/schemas/Id'
        master:
          $ref: '../common/ids.yml#/components/schemas/Id'
        maxPlayers:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        image:
          type: string
          maxLength: 200
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        gameType:
          $ref: '#/components/schemas/GameSessionType'

    ScheduledGameUpdate:
      type: object
      required: [title, master, maxPlayers, start, gameType]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        table:
          $ref: '../common/ids.yml#/components/schemas/Id'
        master:
          $ref: '../common/ids.yml#/components/schemas/Id'
        maxPlayers:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        image:
          type: string
          maxLength: 200
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        gameType:
          $ref: '#/components/schemas/GameSessionType'

    GameSessionType:
      type: string
      enum: [oneshot, campaign]

    CalendarStatus:
      type: string
      enum: [draft, pendring_review, published, rejected, cancelled]

    RecurrenceUnit:
      type: string
      enum: [daily, weekly, monthly]

    RecurrenceStatus:
      type: string
      enum: [active, cancelled, completed]

    Recurrence:
      type: object
      required: [interval, unit]
      properties:
        interval:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
        unit:
          $ref: '#/components/schemas/RecurrenceUnit'
        status:
          $ref: '#/components/schemas/RecurrenceStatus'

    ScheduledGame:
      type: object
      required: [number, title, master, start, published, gameType]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        table:
          $ref: '#/components/schemas/GameTable'
        master:
          $ref: '../common/ids.yml#/components/schemas/Id'
        maxPlayers:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        image:
          type: string
          maxLength: 200
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        status:
          $ref: '#/components/schemas/CalendarStatus'
        gameType:
          $ref: '#/components/schemas/GameSessionType'
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'

    ScheduledGamePageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledGame'

    ScheduledGameResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ScheduledGame'