get:
  summary: Get a specific scheduled game
  operationId: getOneScheduledGame
  tags: [ScheduledGame]
  parameters:
    - in: path
      name: number
      required: true
      schema:
        $ref: '../common/ids.yml#/components/schemas/Id'
  responses:
    '200':
      description: Scheduled game details
      content:
        application/json:
          schema:
            $ref: '../components/scheduled_games.yml#/components/schemas/ScheduledGameResponse'
delete:
  summary: Delete a scheduled game
  operationId: deleteScheduledGame
  tags: [ScheduledGame]
  parameters:
    - in: path
      name: number
      required: true
      schema:
        $ref: '../common/ids.yml#/components/schemas/Id'
  responses:
    '200':
      description: Deleted scheduled game
      content:
        application/json:
          schema:
            $ref: '../components/scheduled_games.yml#/components/schemas/ScheduledGameResponse'
put:
  summary: Update a scheduled game
  operationId: updateScheduledGame
  tags: [ScheduledGame]
  parameters:
    - in: path
      name: number
      required: true
      schema:
        $ref: '../common/ids.yml#/components/schemas/Id'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/scheduled_games.yml#/components/schemas/ScheduledGameUpdate'
  responses:
    '200':
      description: ScheduledGame updated
      content:
        application/json:
          schema:
            $ref: '../components/scheduled_games.yml#/components/schemas/ScheduledGameResponse'
