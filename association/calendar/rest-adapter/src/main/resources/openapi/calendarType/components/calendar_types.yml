components:
  parameters:
    calendarTypesSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      required: false
      schema:
        type: array
        items:
          type: string
          pattern: '^(name|color)\|(asc|desc)$'
          example: name|asc

  schemas:
    CalendarTypeCreation:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 20

    CalendarTypeUpdate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 20

    CalendarType:
      type: object
      required: [number, name, color]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 20

    CalendarTypePageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/CalendarType'

    CalendarTypeResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/CalendarType'
