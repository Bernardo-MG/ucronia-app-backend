post:
  summary: Create a scheduled game.
  operationId: createScheduledGame
  tags: [ScheduledGame]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/scheduled_games.yml#/components/schemas/ScheduledGameCreation'
  responses:
    '201':
      description: Scheduled game created.
      content:
        application/json:
          schema:
            $ref: '../components/scheduled_games.yml#/components/schemas/ScheduledGameResponse'

get:
  summary: Get all scheduled games.
  operationId: getAllScheduledGames
  tags: [ScheduledGame]
  parameters:
    - $ref: '../common/pagination.yml#/components/parameters/pageParam'
    - $ref: '../common/pagination.yml#/components/parameters/sizeParam'
    - $ref: '../components/scheduled_games.yml#/components/parameters/scheduledGamesSortParam'
    - name: date
      description: Date to query for.
      in: query
      schema:
        $ref: '../common/dates.yml#/components/schemas/Date'
    - name: from
      description: Starting date to query for.
      in: query
      schema:
        $ref: '../common/dates.yml#/components/schemas/Date'
    - name: to
      description: Ending date to query for.
      in: query
      schema:
        $ref: '../common/dates.yml#/components/schemas/Date'
  responses:
    '200':
      description: Scheduled games page
      content:
        application/json:
          schema:
            $ref: '../components/scheduled_games.yml#/components/schemas/ScheduledGamePageResponse'