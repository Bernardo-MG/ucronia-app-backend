components:
  parameters:
    scheduledGamesSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      required: false
      schema:
        type: array
        items:
          type: string
          pattern: '^(description|title|location|start|maxPlayers)\|(asc|desc)$'
          example: date|asc

  schemas:
    ScheduledGameDate:
      type: object
      required: [start, end]
      properties:
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        end:
          $ref: '../common/dates.yml#/components/schemas/Date'

    ScheduledGameCreation:
      type: object
      required: [title]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        master:
          $ref: '../common/ids.yml#/components/schemas/Id'
        maxPlayers:
          type: integer
          format: int32
        image:
          type: string
          maxLength: 200
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        recurrence:
          $ref: '#/components/schemas/Recurrence'

    ScheduledGameUpdate:
      type: object
      required: [title]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        master:
          $ref: '../common/ids.yml#/components/schemas/Id'
        maxPlayers:
          type: integer
          format: int32
        image:
          type: string
          maxLength: 200
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        recurrence:
          $ref: '#/components/schemas/Recurrence'

    Recurrence:
      type: object
      properties:
        interval:
          type: integer
          format: int32
        unit:
          type: string
          enum: [daily, weekly, monthly]

    ScheduledGame:
      type: object
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        master:
          $ref: '../common/ids.yml#/components/schemas/Id'
        maxPlayers:
          type: integer
          format: int32
        image:
          type: string
          maxLength: 200
        start:
          $ref: '../common/dates.yml#/components/schemas/Date'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        published:
          type: boolean

    ScheduledGamePageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledGame'

    ScheduledGameResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ScheduledGame'