components:
  parameters:
    authorsSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(name|number)\|(asc|desc)$'
          example: name|asc
  schemas:
    Author:
      type: object
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Gary Gigax'
    AuthorCreation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Gary Gigax'
    AuthorUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Gary Gigax'
    AuthorPageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Author'
    AuthorResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Author'