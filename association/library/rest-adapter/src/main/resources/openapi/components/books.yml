components:
  parameters:
    booksSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(title.supertitle|title.subtitle|title.title|number)\|(asc|desc)$'
          example: title|asc
  schemas:
    Donor:
      type: object
      required: [number, name]
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/DonorName'
    DonorName:
      type: object
      required: [firstName, lastName, fullName]
      properties:
        firstName:
          type: string
          example: 'John'
          maxLength: 50
        lastName:
          type: string
          example: 'Smith'
          maxLength: 50
        fullName:
          type: string
          example: 'John Smith'
          maxLength: 100
    BookCreation:
      type: object
      required: [title, isbn, language]
      properties:
        title:
          $ref: '#/components/schemas/BookTitle'
        isbn:
          type: string
          maxLength: 17
        language:
          type: string
          maxLength: 15
    FictionBookUpdate:
      type: object
      required: [title, isbn, language]
      properties:
        title:
          $ref: '#/components/schemas/BookTitle'
        isbn:
          type: string
          maxLength: 17
        language:
          type: string
          maxLength: 15
        publishDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
          nullable: true
        authors:
          type: array
          items:
            $ref: '../common/ids.yml#/components/schemas/Id'
        publishers:
          type: array
          items:
            $ref: '../common/ids.yml#/components/schemas/Id'
        donation:
          $ref: '#/components/schemas/Donation'
    GameBookUpdate:
      type: object
      required: [title, isbn, language]
      properties:
        title:
          $ref: '#/components/schemas/BookTitle'
        isbn:
          type: string
          maxLength: 17
        language:
          type: string
          maxLength: 15
        publishDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
          nullable: true
        authors:
          type: array
          items:
            $ref: '../common/ids.yml#/components/schemas/Id'
        publishers:
          type: array
          items:
            $ref: '../common/ids.yml#/components/schemas/Id'
        bookType:
          $ref: '../common/ids.yml#/components/schemas/Id'
        gameSystem:
          $ref: '../common/ids.yml#/components/schemas/Id'
        donation:
          $ref: '#/components/schemas/Donation'
    BookTitle:
      type: object
      required: [title]
      properties:
        supertitle:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 100
        subtitle:
          type: string
          maxLength: 100
        fullTitle:
          type: string
          maxLength: 302
    Donation:
      type: object
      properties:
        date:
          $ref: '../common/dates.yml#/components/schemas/Date'
          nullable: true
        donors:
          type: array
          items:
            $ref: '#/components/schemas/Donor'
    FictionBook:
      type: object
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        title:
          $ref: '#/components/schemas/BookTitle'
        isbn:
          type: string
          maxLength: 17
        language:
          type: string
          maxLength: 15
        publishDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
          nullable: true
        lent:
          type: boolean
        authors:
          type: array
          items:
            $ref: 'authors.yml#/components/schemas/Author'
        publishers:
          type: array
          items:
            $ref: 'publishers.yml#/components/schemas/Publisher'
        lendings:
          type: array
          items:
            $ref: 'book_lendings.yml#/components/schemas/BookLendingInfo'
        donation:
          $ref: '#/components/schemas/Donation'
          nullable: true
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'
    GameBook:
      type: object
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        title:
          $ref: '#/components/schemas/BookTitle'
        isbn:
          type: string
          maxLength: 17
        language:
          type: string
          maxLength: 15
        publishDate:
          $ref: '../common/dates.yml#/components/schemas/Date'
          nullable: true
        lent:
          type: boolean
        authors:
          type: array
          items:
            $ref: 'authors.yml#/components/schemas/Author'
        publishers:
          type: array
          items:
            $ref: 'publishers.yml#/components/schemas/Publisher'
        lendings:
          type: array
          items:
            $ref: 'book_lendings.yml#/components/schemas/BookLendingInfo'
        bookType:
          $ref: 'book_types.yml#/components/schemas/BookType'
        gameSystem:
          $ref: 'game_systems.yml#/components/schemas/GameSystem'
        donation:
          $ref: '#/components/schemas/Donation'
          nullable: true
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'
    FictionBookPageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/FictionBook'
    GameBookPageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/GameBook'
    FictionBookResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/FictionBook'
    GameBookResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/GameBook'