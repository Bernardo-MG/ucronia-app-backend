        - createTable:
            schemaName: inventory
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_books
                    nullable: false
              - column:
                  name: type
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_books_number
                    nullable: false
              - column:
                  name: isbn
                  type: varchar(17)
                  constraints:
                    nullable: false
              - column:
                  name: supertitle
                  type: varchar(100)
                  constraints:
                    nullable: true
                  defaultValue: ''
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: subtitle
                  type: varchar(100)
                  constraints:
                    nullable: true
                  defaultValue: ''
              - column:
                  name: language
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: publish_date
                  type: datetime
              - column:
                  name: donation_date
                  type: datetime
              - column:
                  name: game_system_id
                  type: bigint
              - column:
                  name: book_type_id
                  type: bigint
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: fk_books_created_by_user
            baseTableSchemaName: inventory
            baseTableName: books
            baseColumnNames: created_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addForeignKeyConstraint:
            constraintName: fk_books_updated_by_user
            baseTableSchemaName: inventory
            baseTableName: books
            baseColumnNames: updated_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addAutoIncrement:
            schemaName: inventory
            tableName: books
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - addForeignKeyConstraint:
            constraintName: fk_books_game_system
            baseTableSchemaName: inventory
            baseTableName: books
            baseColumnNames: game_system_id
            referencedTableSchemaName: inventory
            referencedTableName: game_systems
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addForeignKeyConstraint:
            constraintName: fk_books_book_type
            baseTableSchemaName: inventory
            baseTableName: books
            baseColumnNames: book_type_id
            referencedTableSchemaName: inventory
            referencedTableName: book_types
            referencedColumnNames: id
            onDelete: "SET NULL"
        - append:
            dbms: mysql
            value: ' ENGINE=InnoDB DEFAULT CHARSET=latin1'
  - changeSet:
      id: library_relationships
      author: Bernardo
      changes:
        - createTable:
            schemaName: inventory
            tableName: book_authors
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_authors_book
                    references: inventory.books(id)
                    deleteCascade: true
              - column:
                  name: author_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_authors_author
                    references: inventory.authors(id)
                    deleteCascade: true
        - addPrimaryKey:
            constraintName: pk_book_authors
            schemaName: inventory
            tableName: book_authors
            columnNames: 'book_id, author_id'
        - createTable:
            schemaName: inventory
            tableName: book_publishers
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_publishers_book
                    references: inventory.books(id)
                    deleteCascade: true
              - column:
                  name: publisher_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_publishers_publisher
                    references: inventory.publishers(id)
                    deleteCascade: true
        - addPrimaryKey:
            constraintName: pk_book_publishers
            schemaName: inventory
            tableName: book_publishers
            columnNames: 'book_id, publisher_id'
      modifySql:
        - append:
            dbms: mysql
            value: ' ENGINE=InnoDB DEFAULT CHARSET=latin1'
  - changeSet:
      id: library_donors
      author: Bernardo
      changes:
        - createTable:
            schemaName: inventory
            tableName: book_donors
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_donors_book
                    references: inventory.books(id)
                    deleteCascade: true
              - column:
                  name: donor_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_donors_donor
                    references: directory.profiles(id)
                    deleteCascade: true
        - addPrimaryKey:
            constraintName: pk_book_donors
            schemaName: inventory
            tableName: book_donors
            columnNames: 'book_id, donor_id'
      modifySql:
        - append:
            dbms: mysql
            value: ' ENGINE=InnoDB DEFAULT CHARSET=latin1'
  - changeSet:
      id: library_lending
      author: Bernardo
      changes:
        - createTable:
            schemaName: inventory
            tableName: book_lendings
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_lendings_book
                    references: inventory.books(id)
                    deleteCascade: true
              - column:
                  name: borrower_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: lending_date
                  type: datetime
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: return_date
                  type: datetime
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: fk_book_lendings_borrower
            baseTableSchemaName: inventory
            baseTableName: book_lendings
            baseColumnNames: borrower_id
            referencedTableSchemaName: directory
            referencedTableName: profiles
            referencedColumnNames: id
            onDelete: "RESTRICT"
        - addForeignKeyConstraint:
            constraintName: fk_book_lendings_created_by_user
            baseTableSchemaName: inventory
            baseTableName: book_lendings
            baseColumnNames: created_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addForeignKeyConstraint:
            constraintName: fk_book_lendings_updated_by_user
            baseTableSchemaName: inventory
            baseTableName: book_lendings
            baseColumnNames: updated_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addPrimaryKey:
            constraintName: pk_book_lendings
            schemaName: inventory
            tableName: book_lendings
            columnNames: 'book_id, borrower_id, lending_date'
