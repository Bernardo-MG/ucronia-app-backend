                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_publishers
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_publishers_number
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_publishers_name
