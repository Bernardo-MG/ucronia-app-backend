databaseChangeLog:
  - changeSet:
      id: library
      author: Bernardo
      changes:
        - createTable:
            schemaName: inventory
            tableName: game_systems
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_game_systems
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_game_systems_number
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_game_systems_name
                    nullable: false
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: fk_game_systems_created_by_user
            baseTableSchemaName: inventory
            baseTableName: game_systems
            baseColumnNames: created_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addForeignKeyConstraint:
            constraintName: fk_game_systems_updated_by_user
            baseTableSchemaName: inventory
            baseTableName: game_systems
            baseColumnNames: updated_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addAutoIncrement:
            schemaName: inventory
            tableName: game_systems
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createTable:
            schemaName: inventory
            tableName: book_types
