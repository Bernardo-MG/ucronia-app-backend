services:

  association-db:
    image: postgres:18.0-alpine
    environment:
      PGUSER: 'postgres'
      POSTGRES_DB: 'postgres'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'password'
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      # DB content
      - association-data:/var/lib/postgresql/data
      # Initial data
      - ./sql/01_create_schemas.sql:/docker-entrypoint-initdb.d/01_create_schemas.sql
    networks:
      - db

  association-backend:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    ports:
      - "8080:8080"
      - "8000:8000"
    depends_on:
      association-db:
        condition: service_healthy
      mail:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      # Activates profile
      - spring.profiles.active=dev
      # Logs
      - logging.file.path=./logs
      # DB
      - spring.datasource.url=jdbc:postgresql://association-db:5432/postgres
      - spring.datasource.username=postgres
      - spring.datasource.password=password
      # Mail
      - spring.mail.host=mail
      - spring.mail.port=1025
      - spring.mail.username=username
      - spring.mail.password=password
      - security.email.appName=Ucronía
      - security.email.from=security@somewhere.com
      - security.email.activateUser.url=http://localhost:4200/users/activate
      - security.email.passwordRecovery.url=http://localhost:4200/password/reset/
      # Scheduler
      - scheduler.zone=CET
      # S3-compatible image storage
      - image.s3.endpoint=http://s3:4566
      - image.s3.region=eu-west-1
      - image.s3.bucket=ucronia-images
      - image.s3.access-key=test
      - image.s3.secret-key=test
      - image.s3.path-style=true
    volumes:
      - association-logs:/app/logs
    networks:
      - db
      - mail
      - monitoring
      - object-storage

  load-sample-data:
    image: postgres:18.0-alpine
    depends_on:
      association-db:
        condition: service_healthy
      association-backend:
        condition: service_healthy
    environment:
      PGHOST: association-db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: password
    volumes:
      - ./sql/02_create_users.sql:/sql/02_create_users.sql:ro
    command:
      - sh
      - -c
      - psql --set ON_ERROR_STOP=1 --file=/sql/02_create_users.sql
    restart: "no"
    networks:
      - db

  #=========#
  # SUPPORT #
  #=========#
  mail:
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mail
  s3:
    image: localstack/localstack:4.4.0
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=eu-west-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - s3-data:/var/lib/localstack
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    networks:
      - object-storage
  #============#
  # MONITORING #
  #============#
  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      association-backend:
        condition: service_healthy
    networks:
      - monitoring
  promtail:
    image: grafana/promtail:3.5
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      association-backend:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - association-logs:/logs
    networks:
      - monitoring
  loki:
    image: grafana/loki:3.5
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    depends_on:
      association-backend:
        condition: service_healthy
    healthcheck:
      test: wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q -w ready || exit 1
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 20s 
    networks:
      - monitoring
  grafana:
    image: grafana/grafana:12.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana/dashboard_provider.yml:/etc/grafana/provisioning/dashboards/dashboard_provider.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
volumes:
  association-data:
  association-logs:
  s3-data:
networks:
  db:
  mail:
  monitoring:
  object-storage:
