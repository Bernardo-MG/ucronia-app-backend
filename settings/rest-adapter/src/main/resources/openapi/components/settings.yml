components:
  parameters:
    settingsSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(code|type)\|(asc|desc)$'
          example: code|asc
  schemas:
    Setting:
      type: object
      required: [type, code, value]
      properties:
        type:
          type: string
          maxLength: 60
          description: Type of the setting.
        code:
          type: string
          maxLength: 60
          description: Unique code identifying the setting.
        value:
          type: string
          maxLength: 300
          description: Value of the setting.
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'
    SettingUpdate:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 300
          description: Updated value for the setting.
    SettingsResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
    SettingResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Setting'