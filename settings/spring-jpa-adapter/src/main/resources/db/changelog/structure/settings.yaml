databaseChangeLog:
  - changeSet:
      id: settings_table
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_configuration_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
        - createTable:
            schemaName: configuration
            tableName: settings
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(60)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: config_value
                  type: varchar(300)
                  constraints:
                    nullable: false
                  defaultValue: ''
              - column:
                  name: value_type
                  type: varchar(60)
                  constraints:
                    nullable: false
                  defaultValue: 'string'
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_fees_created_by_user
                    references: security.users(id)
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_fees_updated_by_user
                    references: security.users(id)
        - addAutoIncrement:
            schemaName: configuration
            tableName: settings
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createIndex:
            schemaName: configuration
            tableName: settings
            indexName: idx_settings_code
            columns:
              - column:
                  name: code
      modifySql:
        - append:
            dbms: mysql
            value: ' ENGINE=InnoDB DEFAULT CHARSET=latin1'
