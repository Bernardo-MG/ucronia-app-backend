databaseChangeLog:
  - changeSet:
      id: settings_table
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_configuration_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
        - createTable:
            schemaName: configuration
            tableName: settings
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_settings
                    nullable: false
              - column:
                  name: code
                  type: varchar(60)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_settings_code
              - column:
                  name: config_value
                  type: varchar(300)
                  constraints:
                    nullable: false
                  defaultValue: ''
              - column:
                  name: value_type
                  type: varchar(60)
                  constraints:
                    nullable: false
                  defaultValue: 'string'
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: fk_settings_created_by_user
            baseTableSchemaName: configuration
            baseTableName: settings
            baseColumnNames: created_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addForeignKeyConstraint:
            constraintName: fk_settings_updated_by_user
            baseTableSchemaName: configuration
            baseTableName: settings
            baseColumnNames: updated_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
            onDelete: "SET NULL"
        - addAutoIncrement:
            schemaName: configuration
            tableName: settings
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
      modifySql:
        - append:
            dbms: mysql
            value: ' ENGINE=InnoDB DEFAULT CHARSET=latin1'
