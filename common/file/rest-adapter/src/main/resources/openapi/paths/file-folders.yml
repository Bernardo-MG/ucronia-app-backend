get:
  summary: Get the file folder tree.
  operationId: getFileFolders
  tags: [File folder]
  responses:
    '200':
      description: All file folders.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/file-folders.yml#/components/schemas/FileFolder'
post:
  summary: Create an file folder.
  operationId: createFileFolder
  tags: [File folder]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/file-folders.yml#/components/schemas/FileFolderCreation'
  responses:
    '201':
      description: Folder created.
      content:
        application/json:
          schema:
            $ref: '../components/file-folders.yml#/components/schemas/FileFolder'
    '409':
       description: A sibling folder with the same name exists.
