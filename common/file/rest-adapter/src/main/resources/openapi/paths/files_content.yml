get:
  summary: Get file content.
  operationId: getFileContent
  tags: [File]
  parameters:
    - in: path
      name: number
      required: true
      description: File number.
      schema:
         $ref: '../common/ids.yml#/components/schemas/Id'
  responses:
    '200':
      description: File content.
      headers:
        Content-Disposition:
          description: Indicates that the file should be downloaded as an attachment using its stored name.
          schema:
            type: string
            example: attachment; filename="document.pdf"
        X-Content-Type-Options:
          description: Prevents media type sniffing.
          schema:
            type: string
            example: nosniff
        Cache-Control:
          description: Private files are returned with `private, no-store`.
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            $ref: '../components/files.yml#/components/schemas/FileContent'
    '404':
      description: File not found.
    '403':
      description: FILE:READ is required for a private file.
