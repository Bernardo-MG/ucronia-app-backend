databaseChangeLog:
  - changeSet:
      id: asset_schema
      author: Bernardo
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS asset
  - changeSet:
      id: asset_tables
      author: Bernardo
      changes:
        - createTable:
            schemaName: asset
            tableName: asset_folders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_asset_folders_created_by_user
                    references: security.users(id)
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_asset_folders_updated_by_user
                    references: security.users(id)
        - addUniqueConstraint:
            schemaName: asset
            tableName: asset_folders
            columnNames: id, type
            constraintName: uk_asset_folders_id_type
        - addUniqueConstraint:
            schemaName: asset
            tableName: asset_folders
            columnNames: type, number
            constraintName: uk_asset_folders_type_number
        - addUniqueConstraint:
            schemaName: asset
            tableName: asset_folders
            columnNames: type, parent_id, name
            constraintName: uk_asset_folders_parent_name
        - addForeignKeyConstraint:
            baseTableSchemaName: asset
            baseTableName: asset_folders
            baseColumnNames: parent_id, type
            referencedTableSchemaName: asset
            referencedTableName: asset_folders
            referencedColumnNames: id, type
            constraintName: fk_asset_folders_parent_type
        - createTable:
            schemaName: asset
            tableName: assets
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: media_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: public_access
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: folder_id
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_assets_created_by_user
                    references: security.users(id)
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_assets_updated_by_user
                    references: security.users(id)
        - addUniqueConstraint:
            schemaName: asset
            tableName: assets
            columnNames: type, number
            constraintName: uk_assets_type_number
        - addUniqueConstraint:
            schemaName: asset
            tableName: assets
            columnNames: type, folder_id, name
            constraintName: uk_assets_folder_name
        - addForeignKeyConstraint:
            baseTableSchemaName: asset
            baseTableName: assets
            baseColumnNames: folder_id, type
            referencedTableSchemaName: asset
            referencedTableName: asset_folders
            referencedColumnNames: id, type
            constraintName: fk_assets_folder_type
        - createIndex:
            schemaName: asset
            tableName: assets
            indexName: idx_assets_type_folder
            columns:
              - column:
                  name: type
              - column:
                  name: folder_id