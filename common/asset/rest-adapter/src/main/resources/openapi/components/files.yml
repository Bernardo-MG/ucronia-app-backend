components:
  parameters:
    filesSortParam:
      name: sort
      description: Sorting to apply.
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(name|number|mediaType|size)\|(asc|desc)$'
          example: name|asc
  schemas:
    File:
      type: object
      properties:
        number:
          $ref: '../common/ids.yml#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        folderNumber:
          type: integer
          format: int64
          nullable: true
        mediaType:
          type: string
        size:
          type: integer
          format: int64
        publicAccess:
          type: boolean
        audit:
          $ref: 'audit.yml#/components/schemas/AuditDetails'
    FileCreation:
      type: object
      required: [name, description, file]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        publicAccess:
          type: boolean
          default: true
        file:
          type: string
          format: binary
    FileUpdate:
      type: object
      required: [name, description, publicAccess, file]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        publicAccess:
          type: boolean
        file:
          type: string
          format: binary
    FileMetadataUpdate:
      type: object
      required: [name, description, publicAccess]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        publicAccess:
          type: boolean
    FileResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/File'
    FilePageResponse:
      allOf:
        - $ref: '../common/responses.yml#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/File'
    FileContent:
      type: string
      format: binary
