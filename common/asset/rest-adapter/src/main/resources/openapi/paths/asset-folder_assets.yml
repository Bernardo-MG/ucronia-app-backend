parameters:
  - in: path
    name: folderNumber
    required: true
    schema:
       $ref: '../common/ids.yml#/components/schemas/Id'
get:
  summary: Get the assets directly contained by a folder.
  operationId: getAssetsInFolder
  tags: [Asset folder]
  parameters:
    - $ref: '../common/pagination.yml#/components/parameters/pageParam'
    - $ref: '../common/pagination.yml#/components/parameters/sizeParam'
    - $ref: '../components/assets.yml#/components/parameters/assetsSortParam'
  responses:
    '200':
      description: Page of asset metadata.
      content:
        application/json:
          schema:
            $ref: '../components/assets.yml#/components/schemas/AssetPageResponse'
