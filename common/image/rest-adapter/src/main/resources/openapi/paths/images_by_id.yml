parameters:
  - in: path
    name: number
    required: true
    description: Image number.
    schema: { type: integer, format: int64 }
get:
  summary: Get image metadata.
  operationId: getImage
  tags: [Image]
  responses:
    '200':
      description: Image metadata.
      content:
        application/json:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageResponse'
    '404': { description: Image not found. }
delete:
  summary: Delete an image.
  operationId: deleteImage
  tags: [Image]
  responses:
    '200':
      description: Deleted image metadata.
      content:
        application/json:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageResponse'
    '404': { description: Image not found. }
put:
  summary: Update an image.
  operationId: updateImage
  tags: [Image]
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [name, description, file]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            description: { type: string, maxLength: 500 }
            file: { type: string, format: binary }
  responses:
    '200':
      description: Updated image metadata.
      content:
        application/json:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageResponse'
    '404': { description: Image not found. }
    '409': { description: Image name already exists. }
