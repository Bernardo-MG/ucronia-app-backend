parameters:
  - in: path
    name: number
    required: true
    description: Image number.
    schema:
       $ref: '../common/ids.yml#/components/schemas/Id'
get:
  summary: Get image metadata.
  operationId: getImage
  tags: [Image]
  responses:
    '200':
      description: Image metadata.
      content:
        application/json:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageResponse'
    '404':
       description: Image not found.
delete:
  summary: Delete an image.
  operationId: deleteImage
  tags: [Image]
  responses:
    '200':
      description: Deleted image metadata.
      content:
        application/json:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageResponse'
    '404':
       description: Image not found.
patch:
  summary: Update image metadata without replacing its content.
  operationId: updateImageMetadata
  tags: [Image]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/images.yml#/components/schemas/ImageMetadataUpdate'
  responses:
    '200':
      description: Updated image metadata.
      content:
        application/json:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageResponse'
    '404':
       description: Image not found.
    '409':
       description: Image name already exists.
put:
  summary: Update an image.
  operationId: updateImage
  tags: [Image]
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
           $ref: '../components/images.yml#/components/schemas/ImageUpdate'
  responses:
    '200':
      description: Updated image metadata.
      content:
        application/json:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageResponse'
    '404':
       description: Image not found.
    '409':
       description: Image name already exists.
