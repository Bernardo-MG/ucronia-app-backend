get:
  summary: Get image content.
  operationId: getImageContent
  tags: [Image]
  parameters:
    - in: path
      name: number
      required: true
      description: Image number.
      schema:
         $ref: '../common/ids.yml#/components/schemas/Id'
  responses:
    '200':
      description: Image content.
      headers:
        Content-Disposition:
          description: Indicates that the image should be displayed inline.
          schema:
            type: string
            example: inline
        X-Content-Type-Options:
          description: Prevents media type sniffing.
          schema:
            type: string
            example: nosniff
      content:
        image/png:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageContent'
        image/jpeg:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageContent'
        image/webp:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageContent'
        image/gif:
          schema:
            $ref: '../components/images.yml#/components/schemas/ImageContent'
    '404':
      description: Image not found.
