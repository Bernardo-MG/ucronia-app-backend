get:
  summary: Get the image.
  operationId: getImage
  tags: [Image]
  parameters:
    - name: url
      in: query
      required: true
      description: Image URL.
      schema:
        type: string
        format: uri
  responses:
    '200':
      description: Image content.
      content:
        image/png:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
        image/jpeg:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
        image/webp:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
        image/gif:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
    '400':
      description: Invalid URL.
    '404':
      description: Image not found.