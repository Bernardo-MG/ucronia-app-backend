get:
  summary: Get the image.
  operationId: getImage
  tags: [Image]
  parameters:
    - in: path
      name: name
      required: true
      description: Image name.
      schema:
        type: string
  responses:
    '200':
      description: Image content.
      content:
        image/png:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
        image/jpeg:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
        image/webp:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
        image/gif:
          schema:
            $ref: '../components/images.yml#/components/schemas/Image'
    '400':
      description: Invalid URL.
    '404':
      description: Image not found.
put:
  summary: Upload or replace an image.
  operationId: uploadImage
  tags: [Image]
  parameters:
    - in: path
      name: name
      required: true
      description: Image name.
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [file]
          properties:
            file:
              type: string
              format: binary
  responses:
    '204':
      description: Image uploaded.
    '400':
      description: Invalid image.
