databaseChangeLog:
  - changeSet:
      id: image_schema
      author: Bernardo
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS image
  - changeSet:
      id: image_table
      author: Bernardo
      changes:
        - createTable:
            schemaName: image
            tableName: images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: media_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_images_created_by_user
                    references: security.users(id)
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_images_updated_by_user
                    references: security.users(id)
  - changeSet:
      id: image_folder_table
      author: Bernardo
      changes:
        - createTable:
            schemaName: image
            tableName: image_folders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_image_folder_parent
                    references: image.image_folders(id)
              - column: { name: created_at, type: datetime }
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_image_folders_created_by_user
                    references: security.users(id)
              - column: { name: updated_at, type: datetime }
              - column:
                  name: updated_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_image_folders_updated_by_user
                    references: security.users(id)
        - addUniqueConstraint:
            schemaName: image
            tableName: image_folders
            columnNames: parent_id, name
            constraintName: uk_image_folders_parent_name
        - sql:
            sql: CREATE UNIQUE INDEX uk_image_folders_root_name ON image.image_folders (name) WHERE parent_id IS NULL
        - addColumn:
            schemaName: image
            tableName: images
            columns:
              - column:
                  name: folder_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_images_folder
                    references: image.image_folders(id)
        - createIndex:
            schemaName: image
            tableName: images
            indexName: idx_images_folder
            columns:
              - column: { name: folder_id }
