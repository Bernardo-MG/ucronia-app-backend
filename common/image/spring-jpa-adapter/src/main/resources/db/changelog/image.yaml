databaseChangeLog:
  - changeSet:
      id: image_schema
      author: Bernardo
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS image
  - changeSet:
      id: image_tables
      author: Bernardo
      changes:
        - createTable:
            schemaName: image
            tableName: image_folders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_image_folders_parent
                    references: image.image_folders(id)
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_image_folders_created_by_user
                    references: security.users(id)
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_image_folders_updated_by_user
                    references: security.users(id)
        - addUniqueConstraint:
            schemaName: image
            tableName: image_folders
            columnNames: parent_id, name
            constraintName: image_folders_unique_parent_name
        - sql:
            sql: >
              CREATE UNIQUE INDEX image_folders_unique_root_name
              ON image.image_folders (name)
              WHERE parent_id IS NULL
        - createTable:
            schemaName: image
            tableName: images
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: media_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: folder_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_images_folder
                    references: image.image_folders(id)
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_images_created_by_user
                    references: security.users(id)
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    foreignKeyName: fk_images_updated_by_user
                    references: security.users(id)
        - addUniqueConstraint:
            schemaName: image
            tableName: images
            columnNames: folder_id, name
            constraintName: images_unique_folder_name
        - sql:
            sql: >
              CREATE UNIQUE INDEX images_unique_root_name
              ON image.images (name)
              WHERE folder_id IS NULL
        - createIndex:
            schemaName: image
            tableName: images
            indexName: idx_images_folder
            columns:
              - column:
                  name: folder_id